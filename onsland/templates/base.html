<!DOCTYPE html>
<html>
<head>
  <title>{% block title %}{% endblock %} - B&G Peertube video token</title>
<link rel="stylesheet" media="screen" href = "{{ url_for('static', filename='bootstrap.min.css') }}">
<meta name="viewport" content = "width=device-width, initial-scale=1.0">
<meta charset="utf-8">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
</head>

<body class = "body">

<div class="container">
  <div class="alert alert-primary" role="alert">
    <h3>Zoek naar (her-)bruikbare termen.</h3>
</div>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="#">Beeld en Geluid Termennetwerk
<!--    <img src="static/Beeld_Geluid_R_Zwart.jpg" alt="Beeld en Geluid Termennetwerk" height="30" />-->
  </a>

  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav mr-auto">
    </ul>

    <form class="form-inline my-2 my-lg-0"  action="/search" method="POST">
      <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search" name="searchterm"/>
      <button class="btn btn-outline-success my-2 my-sm-0" type="submit" >Search</button>
    </form>

  </div>
</nav>
<div class="container">
  <ul class="nav nav-pills">
    <li class="active"><a data-toggle="pill" href="#menuplaatsen">Plaatsen</a></li>
    <li><a data-toggle="pill" href="#menupersonen">Personen</a></li>
    <li><a data-toggle="pill" href="#menuonderwerpen">Onderwerpen</a></li>
  </ul>

  <div class="tab-content">
    <div id="menuplaatsen" class="tab-pane fade in active">
      {% block contentplaatsen %}{% endblock %}
    </div>
    <div id="menupersonen" class="tab-pane fade">
      {% block contentpersonen %}{% endblock %}
    </div>
    <div id="menuonderwerpen" class="tab-pane fade">
        {% block contentonderwerpen %}{% endblock %}
    </div>
  </div>
</div>
<hr>

</div>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
</body>
</html>
